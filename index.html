<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Buku Harian Digital - Dokumentasi kegiatan harian Anda">
    <title>Buku Harian Digital — Masuk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <!-- Animated background particles -->
    <div class="bg-particles" id="bg-particles"></div>

    <div class="login-container">
        <div class="login-card">
            <!-- Decorative top accent -->
            <div class="login-card-accent"></div>

            <div class="login-card-body">
                <div class="login-icon">📖</div>
                <h1 class="login-title">Buku Harian</h1>
                <p class="login-subtitle">Masukkan kata sandi untuk membuka buku harian Anda.</p>

                <form id="form-login" onsubmit="return false;">
                    <div class="form-group">
                        <label for="input-password">
                            <span class="label-icon">🔑</span> Kata Sandi
                        </label>
                        <div class="input-wrapper">
                            <input type="password" id="input-password" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" id="btn-toggle-password" aria-label="Tampilkan password">
                                👁️
                            </button>
                        </div>
                    </div>
                    <button type="submit" id="btn-login">
                        <span class="btn-text">Masuk</span>
                        <span class="btn-arrow">→</span>
                    </button>
                </form>

                <p id="login-error" class="error-text" style="display:none;">
                    <span class="error-icon">⚠️</span> Kata sandi salah.
                </p>

                <div class="login-divider">
                    <span>atau</span>
                </div>

                <p class="hint-text">Belum punya akun? Daftar dulu di Supabase, lalu atur konfigurasi di halaman pengaturan.</p>
            </div>
        </div>

        <footer class="login-footer">
            <p>📖 Buku Harian Digital &mdash; Catatan kehidupan sehari-hari.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
